name: Astro portfolio checks
on:
  push:
    branches: ["phase-1/astro-foundation"]
    paths: ["astro/**", ".github/workflows/portfolio-checks.yml"]
  pull_request:
    branches: [master]
    paths: ["astro/**", ".github/workflows/portfolio-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproducible clean install from committed lockfile
        run: npm ci
      - name: Confirm dependency manifests were not modified
        run: git diff --exit-code HEAD -- package.json package-lock.json
      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || AUDIT_STATUS=$?
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('Dependency audit summary:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(JSON.stringify({ name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map(v => typeof v === 'string' ? v : { name: v.name, title: v.title, range: v.range, url: v.url }) }));
          }
          NODE
          if [ "${AUDIT_STATUS:-0}" -ne 0 ]; then
            echo "npm audit reported dependency vulnerabilities; review npm-audit.json."
            exit "${AUDIT_STATUS}"
          fi
      - name: Astro and TypeScript diagnostics
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests and responsive screenshots
        run: npm run test:e2e
      - name: Wait for the exact commit on the isolated Cloudflare preview
        id: preview
        env:
          EXPECTED_PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_URL: https://osama-portfolio-preview.pages.dev
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = process.env.EXPECTED_PREVIEW_SHA;
          const origin = process.env.PREVIEW_URL;
          const deadline = Date.now() + 8 * 60 * 1000;
          let attempt = 0;
          let lastSeen = "no response";
          while (Date.now() < deadline) {
            attempt += 1;
            const url = new URL(origin);
            url.searchParams.set("ci_expected_sha", expected);
            url.searchParams.set("attempt", String(attempt));
            try {
              const response = await fetch(url, { headers: { "cache-control": "no-cache", "pragma": "no-cache" }, signal: AbortSignal.timeout(12000) });
              const html = await response.text();
              const match = html.match(/<meta[^>]+name=["']portfolio-build-commit["'][^>]+content=["']([^"']+)["']/i);
              lastSeen = response.ok ? (match?.[1] ?? "commit marker missing") : `HTTP ${response.status}`;
              if (response.ok && match?.[1] === expected) {
                const evidence = { url: origin, expectedCommit: expected, observedCommit: match[1], status: response.status, attempts: attempt, verifiedAt: new Date().toISOString() };
                fs.writeFileSync("preview-readiness.json", JSON.stringify(evidence, null, 2) + "\\n");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${origin}\\ncommit=${expected}\\nattempts=${attempt}\\n`);
                console.log("Preview serves the expected commit:", JSON.stringify(evidence));
                process.exit(0);
              }
              console.log(`Attempt ${attempt}: preview not ready; observed ${lastSeen}; expected ${expected}`);
            } catch (error) {
              lastSeen = error instanceof Error ? error.message : String(error);
              console.log(`Attempt ${attempt}: preview not ready; ${lastSeen}`);
            }
            const delay = Math.min(30000, 5000 * 2 ** Math.min(attempt - 1, 3));
            await new Promise(resolve => setTimeout(resolve, delay));
          }
          console.error(`Preview did not serve expected commit ${expected} within 8 minutes. Last observation: ${lastSeen}`);
          process.exit(1);
          NODE
      - name: Verify theme interactions and visual evidence on deployed preview
        env:
          DEPLOYED_PREVIEW_URL: ${{ steps.preview.outputs.url }}
          EXPECTED_DEPLOYED_COMMIT: ${{ steps.preview.outputs.commit }}
        run: npm run test:preview
      - name: Confirm dependency manifests remain unchanged
        run: git diff --exit-code HEAD -- package.json package-lock.json
      - name: Publish visual evidence index to job summary
        if: always()
        run: |
          cat docs/PHASE-1.5-VISUAL-EVIDENCE.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f preview-readiness.json ]; then
            echo '## Deployed preview identity' >> "$GITHUB_STEP_SUMMARY"
            cat preview-readiness.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-evidence
          path: |
            astro/test-results/
            astro/playwright-report/
            astro/npm-audit.json
            astro/package-lock.json
            astro/docs/PHASE-1.5-VISUAL-EVIDENCE.md
            astro/preview-readiness.json
          if-no-files-found: ignore
