name: Astro portfolio checks
on:
  push:
    branches: ["phase-1/astro-foundation"]
    paths: ["astro/**", ".github/workflows/portfolio-checks.yml"]
  pull_request:
    branches: [master]
    paths: ["astro/**", ".github/workflows/portfolio-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Astro and TypeScript diagnostics
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests and responsive screenshots
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
