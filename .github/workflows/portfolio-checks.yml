name: Astro portfolio checks
on:
  push:
    branches: ["phase-1/astro-foundation"]
    paths: ["astro/**", ".github/workflows/portfolio-checks.yml"]
  pull_request:
    branches: [master]
    paths: ["astro/**", ".github/workflows/portfolio-checks.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve, pin and lock direct dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[section] ?? {})) {
              const resolved = lock.packages[`node_modules/${name}`]?.version;
              if (!resolved) throw new Error(`No locked direct version found for ${name}`);
              pkg[section][name] = resolved;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Reproducible clean install
        run: npm ci
      - name: Dependency security audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('Dependency audit summary:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(JSON.stringify({ name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map(v => typeof v === 'string' ? v : { name: v.name, title: v.title, range: v.range, url: v.url }) }));
          }
          NODE
      - name: Astro and TypeScript diagnostics
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests and responsive screenshots
        run: npm run test:e2e
      - name: Upload browser and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-evidence
          path: |
            astro/test-results/
            astro/playwright-report/
            astro/npm-audit.json
            astro/package-lock.json
          if-no-files-found: ignore
      - name: Commit exact dependency pins and lockfile
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro/package.json astro/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifest and lockfile are already current."
          else
            git commit -m "Lock and pin Astro portfolio dependencies"
            git push
          fi
